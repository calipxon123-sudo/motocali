<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App del chofer</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#16181d;--mute:#626873;--line:#e2e5ea;--brand:#1f2937;--acc:#e85d04;--ok:#1a7f45;--ok-bg:#ddf3e5;--busy:#9a6200;--busy-bg:#fdefd0;--off:#6b7078;--off-bg:#eceef1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--ink:#eef0f3;--mute:#a0a6b0;--line:#2c3038;--brand:#0b0d10;--ok:#5fd18f;--ok-bg:#163a26;--busy:#f1b44c;--busy-bg:#3d2f12;--off:#a3a8b0;--off-bg:#2a2c30}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
.top{background:var(--brand);color:#fff;padding:14px 16px}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:18px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:0;font:inherit;font-weight:650;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none}
.btn.block{width:100%}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#25d366;color:#06301a}.btn.sm{padding:8px 12px;font-size:14px}.btn:disabled{opacity:.5}
.btn.link{background:none;color:#fff;padding:6px 8px;font-weight:500;opacity:.85}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.carnet{display:flex;gap:14px;align-items:center}
.foto{width:84px;height:112px;border-radius:12px;object-fit:cover;background:var(--off-bg);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mute);cursor:pointer;flex:none;overflow:hidden;padding:0}
.foto img{width:100%;height:100%;object-fit:cover}
.carnet h2{font-size:20px;margin:0}
.estados{display:grid;gap:8px}
.est{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font:inherit;color:var(--ink);text-align:left;font-weight:650;font-size:16px}
.est .dot{width:14px;height:14px;border-radius:50%}
.est[data-e=disponible] .dot{background:var(--ok)}.est[data-e=en_carrera] .dot{background:var(--busy)}.est[data-e=no_disponible] .dot{background:var(--off)}
.est.on[data-e=disponible]{border-color:var(--ok);background:var(--ok-bg)}
.est.on[data-e=en_carrera]{border-color:var(--busy);background:var(--busy-bg)}
.est.on[data-e=no_disponible]{border-color:var(--off);background:var(--off-bg)}
.sol{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.sol.ti{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--acc);color:#fff}
.ruta{margin:6px 0;font-size:15px}
.ruta b{display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;padding:12px;color:var(--mute);font-size:14px}
.count{display:inline-block;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;z-index:9}
.toast.show{opacity:1}.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="in"><h1 id="titulo">🏍️ App del chofer</h1><button class="btn link hide" id="salir">Salir</button></div></div>

<div class="wrap">
  <!-- Login -->
  <form class="card" id="login">
    <h2>Entrar</h2>
    <div class="mute">Usa el teléfono y el PIN que te dio el administrador.</div>
    <label>Teléfono</label><input name="telefono" inputmode="tel" required placeholder="0414…">
    <label>PIN</label><input name="pin" inputmode="numeric" type="password" required maxlength="6">
    <button class="btn block" style="margin-top:16px">Entrar</button>
  </form>

  <div id="app" class="hide">
    <div class="card carnet">
      <label class="foto" id="fotoBox" title="Cambiar foto"><span>📷<br>Toca para<br>poner tu foto</span>
        <input type="file" accept="image/*" capture="user" id="fotoIn" class="hide"></label>
      <div class="grow">
        <h2 id="pNombre"></h2>
        <div class="mute" id="pMoto"></div>
        <div class="mute" id="pTel"></div>
        <button class="btn ghost sm" style="margin-top:8px" id="editar">Editar datos</button>
      </div>
    </div>

    <div class="card">
      <h2>Mi estado</h2>
      <div class="estados">
        <button class="est" data-e="disponible"><span class="dot"></span>Disponible</button>
        <button class="est" data-e="en_carrera"><span class="dot"></span>En carrera</button>
        <button class="est" data-e="no_disponible"><span class="dot"></span>No disponible</button>
      </div>
      <label>¿Dónde estás ahora? (los clientes lo ven)</label>
      <div class="row"><input id="zona" maxlength="80" placeholder="Ej: Plaza, entrada del barrio…"><button class="btn sm" id="guardarZona">Guardar</button></div>
    </div>

    <div class="card">
      <h2>Mis carreras</h2>
      <div id="mias"><div class="empty">Sin carreras activas.</div></div>
    </div>

    <div class="card">
      <h2>Solicitudes nuevas <span class="count hide" id="nPend"></span></h2>
      <div class="mute">Se actualiza solo cada 15 segundos.</div>
      <div id="pend"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>if (window.DEMO) document.write('<script src="mock.js"><\/script>');</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function call(a, d) { return callAPI(a, d); }
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
let CFG = { codigoPais: '58', nombre: 'MotoCali' };
function wa(t) { t = String(t || '').replace(/\D/g, ''); if (!t) return ''; if (t[0] === '0') t = CFG.codigoPais + t.slice(1); else if (t.length <= 10) t = CFG.codigoPais + t; return t; }
function waLink(tel, msg) { return 'https://wa.me/' + wa(tel) + '?text=' + encodeURIComponent(msg); }
function hace(ms) { const m = Math.round((Date.now() - ms) / 60000); if (m < 1) return 'ahora'; if (m < 60) return 'hace ' + m + ' min'; return 'hace ' + Math.round(m / 60) + ' h'; }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); }
const TIPO = { viaje: '🏍️ Viaje', encomienda: '📦 Encomienda', compra: '🛒 Compra' };

let cred = store.get('mb_chofer');   // {telefono, pin}
let perfil = null, vistos = new Set(store.get('mb_vistos') || []), timer;

function conCred(d) { return Object.assign({}, cred, d || {}); }

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  try { perfil = await call('choferEntrar', f); cred = { telefono: f.telefono, pin: f.pin }; store.set('mb_chofer', cred); mostrarApp(); }
  catch (err) { toast(err.message || err); }
});
$('#salir').addEventListener('click', () => { store.del('mb_chofer'); cred = null; perfil = null; clearTimeout(timer); $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#salir').classList.add('hide'); });

function mostrarApp() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#salir').classList.remove('hide');
  pintarPerfil(); refrescar();
}
function pintarPerfil() {
  $('#pNombre').textContent = perfil.nombre;
  $('#pMoto').textContent = perfil.moto ? '🏍️ ' + perfil.moto : 'Moto sin describir';
  $('#pTel').textContent = '📱 ' + perfil.telefono;
  if (document.activeElement !== $('#zona')) $('#zona').value = perfil.zona || '';
  const box = $('#fotoBox');
  const span = box.querySelector('span'), img = box.querySelector('img');
  if (perfil.foto) { if (img) img.src = perfil.foto; else box.insertAdjacentHTML('afterbegin', `<img src="${esc(perfil.foto)}" alt="">`); span.classList.add('hide'); }
  document.querySelectorAll('.est').forEach(b => b.classList.toggle('on', b.dataset.e === perfil.estado));
}

async function actualizar(d, msg) {
  try { perfil = await call('choferActualizar', conCred(d)); pintarPerfil(); if (msg) toast(msg); }
  catch (err) { toast(err.message || err); }
}
document.querySelectorAll('.est').forEach(b => b.addEventListener('click', () => actualizar({ estado: b.dataset.e }, 'Estado: ' + b.textContent.trim())));
$('#guardarZona').addEventListener('click', () => actualizar({ zona: $('#zona').value }, 'Ubicación guardada'));
$('#editar').addEventListener('click', () => {
  const nombre = prompt('Tu nombre', perfil.nombre); if (nombre === null) return;
  const moto = prompt('Tu moto (marca, color, placa)', perfil.moto || ''); if (moto === null) return;
  actualizar({ nombre, moto }, 'Datos guardados');
});

/* Foto tipo carnet: recorta 3:4 y la comprime para guardarla en la hoja */
$('#fotoIn').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const W = 210, H = 280, c = document.createElement('canvas'); c.width = W; c.height = H;
    const r = W / H; let sw = img.width, sh = img.height;
    if (sw / sh > r) sw = sh * r; else sh = sw / r;
    c.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
    let q = 0.8, data; do { data = c.toDataURL('image/jpeg', q); q -= 0.1; } while (data.length > 45000 && q > 0.2);
    URL.revokeObjectURL(url);
    actualizar({ foto: data }, 'Foto actualizada');
  };
  img.src = url; e.target.value = '';
});

async function refrescar() {
  clearTimeout(timer);
  try {
    const r = await call('choferSolicitudes', conCred());
    perfil = r.perfil; pintarPerfil();
    pintarMias(r.mias); pintarPend(r.pendientes);
  } catch (err) {
    if (/PIN/.test(err.message || '')) { $('#salir').click(); toast(err.message); return; }
  }
  timer = setTimeout(refrescar, 15000);
}
function pintarPend(list) {
  const nuevos = list.filter(s => !vistos.has(s.id));
  if (nuevos.length && vistos.size) { try { navigator.vibrate && navigator.vibrate([200, 100, 200]); beep(); } catch (e) {} }
  nuevos.forEach(s => vistos.add(s.id)); store.set('mb_vistos', [...vistos].slice(-200));
  if (!vistos.size) vistos.add('_');
  $('#nPend').textContent = list.length; $('#nPend').classList.toggle('hide', !list.length);
  document.title = (list.length ? '(' + list.length + ') ' : '') + 'App del chofer';
  $('#pend').innerHTML = list.length ? list.map(s => `
    <div class="sol ${s.paraTi ? 'ti' : ''}">
      <div class="row" style="justify-content:space-between"><b>${TIPO[s.tipo] || s.tipo}</b><span class="mute">${hace(s.fecha)}</span></div>
      ${s.paraTi ? '<span class="tag">Te eligieron a ti</span>' : ''}
      <div class="ruta"><span class="mute">Desde</span><b>${esc(s.desde)}</b><span class="mute">Hasta</span><b>${esc(s.hasta)}</b></div>
      ${s.referencia ? `<div class="mute">📝 ${esc(s.referencia)}</div>` : ''}
      <div class="mute">👤 ${esc(s.cliente)}</div>
      <div class="acts"><button class="btn" data-acc="aceptar" data-id="${esc(s.id)}">Aceptar</button></div>
    </div>`).join('') : '<div class="empty">No hay solicitudes por ahora.</div>';
}
function pintarMias(list) {
  $('#mias').innerHTML = list.length ? list.map(s => {
    const msg = `Hola ${s.cliente}, soy ${perfil.nombre} de ${CFG.nombre}. Acepté tu solicitud, voy en camino a ${s.desde}.`;
    return `<div class="sol">
      <div class="row" style="justify-content:space-between"><b>${TIPO[s.tipo] || s.tipo}</b><span class="mute">${esc(s.cliente)}</span></div>
      <div class="ruta"><span class="mute">Desde</span><b>${esc(s.desde)}</b><span class="mute">Hasta</span><b>${esc(s.hasta)}</b></div>
      ${s.referencia ? `<div class="mute">📝 ${esc(s.referencia)}</div>` : ''}
      <div class="acts">
        <a class="btn wa sm" target="_blank" href="${waLink(s.telefono, msg)}">WhatsApp</a>
        <a class="btn ghost sm" href="tel:${esc(s.telefono)}">📞 Llamar</a>
        <button class="btn sm" data-acc="finalizar" data-id="${esc(s.id)}">✓ Terminé</button>
        <button class="btn ghost sm" data-acc="soltar" data-id="${esc(s.id)}">Soltar</button>
      </div></div>`;
  }).join('') : '<div class="empty">Sin carreras activas.</div>';
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-acc]'); if (!b) return;
  if (b.dataset.acc === 'soltar' && !confirm('¿Devolver esta solicitud para que la tome otro chofer?')) return;
  b.disabled = true;
  try {
    await call(b.dataset.acc, conCred({ id: b.dataset.id }));
    toast({ aceptar: '¡Aceptada! Escríbele al cliente.', finalizar: 'Carrera terminada. Quedas disponible.', soltar: 'Solicitud devuelta' }[b.dataset.acc]);
  } catch (err) { toast(err.message || err); }
  refrescar();
});

function beep() {
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  const ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.value = 0.15;
  o.start(); o.stop(ctx.currentTime + 0.25);
}

(async function init() {
  try { CFG = await call('config'); $('#titulo').textContent = '🏍️ ' + CFG.nombre + ' · Chofer'; } catch (e) {}
  if (cred) { try { perfil = await call('choferEntrar', cred); mostrarApp(); } catch (e) { store.del('mb_chofer'); cred = null; } }
})();
</script>
</body>
</html>
